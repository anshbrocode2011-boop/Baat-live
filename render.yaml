services:
  - type: web
    name: baat
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: baat-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://baat.onrender.com
      - key: PORT
        value: 3000

databases:
  - name: baat-db
    databaseName: baat
    user: baat
